      <button id="nextBtn" class="navbtn" aria-label="Próximo slide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
      <div id="hint"><span><kbd>&larr;</kbd> <kbd>&rarr;</kbd> navegar</span><span>&middot;</span><span>lápis anota sobre o slide</span></div>
      <button id="drawFab" aria-label="Anotar sobre o slide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></button>
      <div id="drawToolbar">
        <div class="swatch active" data-color="#F1F4FC" style="background:#F1F4FC;"></div>
        <div class="swatch" data-color="#22D3B8" style="background:#22D3B8;"></div>
        <div class="swatch" data-color="#FF9A4D" style="background:#FF9A4D;"></div>
        <div class="swatch" data-color="#FF6B6B" style="background:#FF6B6B;"></div>
        <div class="tsep"></div>
        <div class="toolbtn" data-w="3">S</div>
        <div class="toolbtn" data-w="7">M</div>
        <div class="toolbtn" data-w="13">G</div>
        <div class="tsep"></div>
        <div class="toolbtn" id="eraseBtn" title="Borracha"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H8l-5-5a2 2 0 0 1 0-2.8l9-9a2 2 0 0 1 2.8 0l5.2 5.2a2 2 0 0 1 0 2.8L13 18"/></svg></div>
        <div class="toolbtn" id="clearDrawBtn" title="Limpar">✕</div>
      </div>
    </div>

    <div id="nbPanel">
      <div id="nbTopbar">
        <div id="nbTitle">Caderno</div>
        <div id="nbPencilBadge"><span class="dot"></span><span class="lbl">Pencil ativa</span></div>
        <div class="nb-tb-group" id="nbToolGroup">
          <button class="nb-btn active" data-tool="pen" title="Caneta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></button>
          <button class="nb-btn" data-tool="highlighter" title="Marca-texto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 11-6 6v3h3l6-6"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-4.2-4.2a2 2 0 0 1 0-2.8L15 5"/><path d="M15 5 19 9"/></svg></button>
          <button class="nb-btn" data-tool="eraser" title="Borracha"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H8l-5-5a2 2 0 0 1 0-2.8l9-9a2 2 0 0 1 2.8 0l5.2 5.2a2 2 0 0 1 0 2.8L13 18"/></svg></button>
        </div>
        <div class="nb-tb-group" id="nbColorGroup">
          <div class="nb-swatch active" data-color="#1B1B1B" style="background:#1B1B1B;"></div>
          <div class="nb-swatch" data-color="#2456D6" style="background:#2456D6;"></div>
          <div class="nb-swatch" data-color="#D63C3C" style="background:#D63C3C;"></div>
          <div class="nb-swatch" data-color="#1E8F5F" style="background:#1E8F5F;"></div>
        </div>
        <div class="nb-tb-group" id="nbWidthGroup">
          <button class="nb-wbtn" data-w="2"><span class="dot" style="width:4px;height:4px;"></span></button>
          <button class="nb-wbtn active" data-w="3.5"><span class="dot" style="width:6px;height:6px;"></span></button>
          <button class="nb-wbtn" data-w="6"><span class="dot" style="width:9px;height:9px;"></span></button>
        </div>
        <div class="nb-tb-group">
          <button class="nb-btn" id="nbFingerToggle" title="Permitir dedo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"/><path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-4.53a1.98 1.98 0 0 1 .17-2.6v0a1.98 1.98 0 0 1 2.79.03L8 15"/></svg></button>
        </div>
        <div class="nb-tb-group">
          <button class="nb-btn" id="nbUndoBtn" title="Desfazer" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
          <button class="nb-btn" id="nbRedoBtn" title="Refazer" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
        </div>
        <div class="nb-tb-group">
          <button class="nb-btn" id="nbClearBtn" title="Limpar página"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>
        </div>
        <div class="tb-menu-wrap">
          <button class="nb-btn" id="nbExportMenuBtn" title="Exportar caderno"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg></button>
          <div class="tb-menu" id="nbExportMenu" style="right:0; left:auto;">
            <div class="tb-menu-label">Exportar caderno</div>
            <button id="nbExportPdfBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg> Todas as páginas (PDF)</button>
            <button id="nbExportPngBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg> Página atual (imagem)</button>
            <div class="tb-menu-sep"></div>
            <button id="nbOpenJsonBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg> Abrir caderno (.json)</button>
            <button id="nbSaveJsonBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg> Salvar caderno (.json)</button>
          </div>
        </div>
        <div class="tb-menu-wrap">
          <button class="nb-btn" id="nbFullToggle" title="Expandir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
        </div>
        <button class="nb-btn" id="nbCloseBtn" title="Fechar caderno"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>

      <div id="nbBody">
        <div id="nbSidebar">
          <div id="nbPageList"></div>
          <button id="addPageBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg> nova página</button>
        </div>
        <div id="nbPaperWrap">
          <div id="nbPageCard">
            <div id="nbPageHeader"><span class="badge"></span><div class="qtext"></div><div class="meta"></div></div>
            <div id="nbCanvasWrap">
              <canvas id="nbBg"></canvas>
              <canvas id="nbInk"></canvas>
              <canvas id="nbLive"></canvas>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="newPagePop">
  <div class="np-opt" data-style="blank"><span class="np-swatch"></span> Em branco</div>
  <div class="np-opt" data-style="lined"><span class="np-swatch" style="background-image:repeating-linear-gradient(#0000 0 11px, #C9BEA9 11px 12px);"></span> Pautada</div>
  <div class="np-opt" data-style="grid"><span class="np-swatch" style="background-image:repeating-linear-gradient(#0000 0 9px,#C9BEA9 9px 10px),repeating-linear-gradient(90deg,#0000 0 9px,#C9BEA9 9px 10px);"></span> Quadriculada</div>
  <div class="np-opt" data-style="dotted"><span class="np-swatch" style="background-image:radial-gradient(#C9BEA9 1px, transparent 1.4px); background-size:10px 10px;"></span> Pontilhada</div>
</div>

<div id="exportOverlay"><div class="spinner"></div><div class="msg">Exportando…</div></div>
<div id="printNbRoot"></div>

<input type="file" id="lessonFileInput" accept="application/json,.json">
<input type="file" id="notebookFileInput" accept="application/json,.json">

<script src="data/lesson-default.js"></script>
<script src="data/notebook-default.js"></script>
<script src="js/ink.js"></script>
<script src="js/slides.js"></script>
<script src="js/notebook.js"></script>
<script src="js/export.js"></script>
<script src="js/app.js"></script>
</body>
