name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "conteudo/**"
      - "agent/**"
      - "README.md"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble static site (só o necessário para publicar)
        run: |
          set -euo pipefail
          mkdir -p dist
          cp index.html dist/
          cp -r css dist/css
          cp -r js dist/js
          cp -r data dist/data
          # conteudo/ (material-fonte, às vezes protegido por direitos
          # autorais) e agent/ (o pipeline do agente) nunca vão ao ar.

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
